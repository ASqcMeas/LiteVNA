[hardware]
  model = "ZNB"
  address = "TCPIP0::192.168.1.123::inst0::INSTR"
  attenuation = 80
  port = "S21"

[sample]
  name = "aligned_test"  # 樣品名稱

[execution]
  action = "run-all"      # 可選: "run-all", "blind-search", "find-windows", "compile", "sweep", "fit"
  dummy = true            # 是否使用模擬模式 (Offline Dummy)

[dummy]
  noise_multiplier = 2.0     # 虛擬 VNA 的量測噪聲放大倍數

[blind_search]
  start_freq_ghz = 4.0
  stop_freq_ghz = 8.0
  prominence_db = "auto"
  min_prominence_db = "auto"

[verification]
  # 驗證掃描的參數配置
  points = 501                # 驗證掃描點數
  if_bandwidth_hz = 200       # 驗證掃描中頻頻寬 (Hz)
  min_span_mhz = 0.2           # 驗證細掃跨距下限 (MHz)
  high_q_trigger_ratio = 2.5   # High-Q 動態重掃觸發臨界比例
  min_resweep_span_mhz = 0.05  # High-Q 重掃最小跨距 (MHz)

[filtering]
  # 評分與硬門檻配置 (若不安裝某門檻，可不設定、註解掉或設為 "none")
  scoring_method = "geometric"         # 選擇評分計算方式: "geometric" (幾何平均) 或 "arithmetic" (算術平均)
  allow_negative_qi = true             # 是否允許/放行圓擬合 Qi < 0 的共振腔 (預設 true)
  min_arithmetic_score = 50.0          # 算術平均分數硬門檻，如50.0/100 (若不設定則無此門檻)
  min_geometric_score = 20.0           # 幾何平均分數硬門檻，如20.0/100 (若不設定則無此門檻)
  max_chisq_fit = 0.05                 # 物理圓擬合殘差硬門檻 (若不設定則無此門檻)
  max_fwhm_ratio = 100.0                # 擬合FWHM與光譜FWHM最大不一致允許倍數 (如100.0倍)
  min_fwhm_khz = 5.0                   # 細掃驗證 FWHM 硬性下限 (kHz, 若不設定則無此門檻)
  max_fwhm_mhz = 100.0                  # 細掃驗證 FWHM 硬性上限 (MHz, 若不設定則無此門檻)
  weight_fwhm = 0.4                    # 頻寬分數權重
  weight_depth = 0.3                   # 波谷深度分數權重
  weight_iq = 0.3                      # 圓擬合品質分數權重


[fwhm]
  # 頻寬估算與護欄參數
  min_khz = 5.0                # 硬性 FWHM 下限 (kHz)
  max_mhz = 30.0               # 硬性 FWHM 上限 (MHz)
  target_fwhm_khz = 300.0      # 評分滿分中心寬度 (kHz)
  fwhm_sigma_decade = 0.5      # 評分容忍度對數標準差 (Decades)
  noise_sigma_multiplier = 15.0 # 訊噪比降噪門檻標準差倍數 (N-sigma)
  min_noise_sigma_multiplier = 5.0 # 尋峰門檻下限標準差倍數 (例如 2.0 或 3.0)
  window_multiplier = 15.0     # 最終掃描窗口為估算 FWHM 的倍數

[blind_search_passes]
  # 多通道盲搜尋的掃描參數
  passes = [
    { power = 0, if_bandwidth = 1000, points = 8001, name = "Pass 1 (0 dBm, 1 kHz)" },
    { power = -10.0, if_bandwidth = 500,  points = 8001, name = "Pass 2 (-10 dBm, 500 Hz)" }
  ]

[resonator_defaults]
  # 輸出到 resonator_PD.toml 的共振腔預設掃描規格
  if_bandwidth = 50
  points = 501
  max_repeat = 10
  min_repeat = 1
  power_ave_ratio = -120
  power_min = -60
  power_max = 0
  power_step = 5

[peak_finding_retry]
  # 最佳化尋找 dip (Step A/B) 的重試與降級機制
  max_retries = 3
  retry_1_points = 1601
  retry_1_ibw_hz = 200
  retry_2_range_multiplier = 2.0
  retry_3_power_boost_db = 5.0
  fallback_window_mhz = 2.0   # 尋找失敗時降級的預設窗口大小 (MHz)

[fitting]
  mode = "refined"            # "refined" (兩階段固定 Qc 擬合) 或 "free" (單次 autofit)

[tls_analysis]
  enabled = true              # 是否在 run-all 時自動執行 TLS 擬合
  n_sat_lowerbound = 0.01     # N_sat 下界
  n_sat_upperbound = 10000    # N_sat 上界
  alpha_lowerbound = 0.2      # alpha 下界
  max_error_threshold = 1e8   # Qi 誤差過濾閾值

